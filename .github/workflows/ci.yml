name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run against freshly resolved dependencies: third-party releases
    # can break the stack without any commit here (PyAV 19.0.0, 2026-09-29).
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff==0.9.0
      - run: ruff check speakerscribe/ tests/ scripts/
      - run: ruff format --check speakerscribe/ tests/ scripts/

  notebooks:
    name: Notebook lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/lint_notebooks.py

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Light install: mypy only needs the typed dependencies; heavy ML
      # packages are ignored via [tool.mypy.overrides].
      - run: pip install mypy "pydantic>=2.5,<3" "loguru>=0.7,<1" "typer>=0.12,<1" "rich>=13.7,<16" "numpy>=1.24"
      - run: pip install --no-deps -e .
      - run: mypy speakerscribe/

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (dev extras)
        run: pip install -e ".[dev]"
      - name: Show resolved audio stack
        run: pip list 2>/dev/null | grep -iE "^(av|faster-whisper|ctranslate2|numpy|pyannote.audio|torch) " || true
      - name: Unit tests (no integration, no GPU)
        run: pytest tests/ -m "not integration and not gpu"

  integration:
    name: Integration (real decoder, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the Google Colab runtime; 3.11 is the oldest with av 18 wheels.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - name: Install package (dev + bench extras)
        run: pip install -e ".[dev,bench]"
      - name: Show resolved audio stack
        run: pip list 2>/dev/null | grep -iE "^(av|faster-whisper|ctranslate2|numpy|pyannote.audio|torch) " || true
      - name: Decoding self-test
        run: python -c "import speakerscribe as s; print(s.check_audio_decoding(require_pyav=True))"
      - name: Integration tests
        # No coverage gate here: integration tests cover a slice by design.
        run: pytest tests/ -m integration --no-cov
